<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Scrollspy</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
      position: relative;
    }
    .section {
      height: 400px;
      padding: 20px;
    }
    #sec1 { background: #f8d7da; }
    #sec2 { background: #d4edda; }
    #sec3 { background: #d1ecf1; }
  </style>
</head>

<body data-spy="scroll" data-target="#navbar" data-offset="50">

<!-- Navbar -->
<nav id="navbar" class="navbar navbar-expand-sm bg-dark navbar-dark fixed-top">
  <ul class="navbar-nav">
    <li class="nav-item"><a class="nav-link" href="#sec1">Section 1</a></li>
    <li class="nav-item"><a class="nav-link" href="#sec2">Section 2</a></li>
    <li class="nav-item"><a class="nav-link" href="#sec3">Section 3</a></li>
  </ul>
</nav>

<!-- Sections -->
<div id="sec1" class="section">
  <h4>Section 1</h4>
  <p>Content for section 1...</p>
</div>

<div id="sec2" class="section">
  <h4>Section 2</h4>
  <p>Content for section 2...</p>
</div>

<div id="sec3" class="section">
  <h4>Section 3</h4>
  <p>Content for section 3...</p>
</div>

</body>
</html>
